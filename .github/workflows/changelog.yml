name: Generar Changelog y Release

on:
  push:
    branches:
      - main  # Cambia esto si tu rama principal se llama 'master'

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Ejecutar Release Please
        uses: googleapis/release-please-action@v4
        with:
          release-type: simple
